# ConnectHub — backend + frontend + LiveKit (dev)
# 1. Copy .env.example → .env and fill MongoDB + AWS values
# 2. docker compose up --build
# 3. App: http://localhost:5173  |  API: http://localhost:8080  |  LiveKit: ws://localhost:7880

services:
  livekit:
    image: livekit/livekit-server
    container_name: connecthub-livekit
    command: ["--dev"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "devkey: secret"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: connecthub-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Returned to the browser in LiveKit token responses (must be reachable from your PC)
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - livekit
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-ws://localhost:7880}
    container_name: connecthub-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
