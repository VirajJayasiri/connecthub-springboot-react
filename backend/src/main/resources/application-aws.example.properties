# Copy to application-local.properties (gitignored) or set these as environment variables.
# spring.profiles.active=local  and name this file application-local.properties under src/main/resources
#
# AWS_S3_ENABLED=true
# AWS_ACCESS_KEY_ID=your_access_key
# AWS_SECRET_ACCESS_KEY=your_secret_key
# AWS_REGION=eu-north-1
# AWS_S3_BUCKET=your-bucket-name
#
# Bucket policy example (public read for media URLs) — adjust bucket name:
# {
#   "Version": "2012-10-17",
#   "Statement": [{
#     "Sid": "PublicReadGetObject",
#     "Effect": "Allow",
#     "Principal": "*",
#     "Action": "s3:GetObject",
#     "Resource": "arn:aws:s3:::YOUR_BUCKET/*"
#   }]
# }
